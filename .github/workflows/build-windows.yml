name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        working-directory: packaging
        run: python -m PyInstaller PhotoDesktopPet.spec --noconfirm

      - name: Self-test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath packaging/dist/PhotoDesktopPet/PhotoDesktopPet.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content packaging/dist/PhotoDesktopPet/selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item packaging/dist/PhotoDesktopPet/selftest.txt

      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md packaging/dist/PhotoDesktopPet/
          Copy-Item LICENSE packaging/dist/PhotoDesktopPet/
          Compress-Archive -Path packaging/dist/PhotoDesktopPet -DestinationPath PhotoDesktopPet-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoDesktopPet-windows-x64
          path: PhotoDesktopPet-windows-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PhotoDesktopPet-windows-x64.zip
          generate_release_notes: true
